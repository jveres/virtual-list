<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <style>
      html {
        background: #ffffff;
        color: #1a1d23;
        color-scheme: light;
      }

      body {
        background: inherit;
        color: inherit;
      }

      html.booting .shell {
        visibility: hidden;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #1a1d23;
          color: #d5d9e1;
          color-scheme: dark;
        }
      }

      html[data-theme="light"] {
        background: #ffffff;
        color: #1a1d23;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        background: #1a1d23;
        color: #d5d9e1;
        color-scheme: dark;
      }
    </style>
    <script>
      document.documentElement.classList.add("booting");
      document.documentElement.setAttribute(
        "data-theme",
        matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
      );
    </script>
    <title>virtual-list · streaming chat</title>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <span class="header-title">
          <a href="/" title="Back to demos">virtual-list</a>
          <span class="sep">·</span>streaming-chat
        </span>
        <div class="header-actions">
          <div class="theme-group" role="group" aria-label="Theme">
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="light"
              title="Light"
              aria-label="Light theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle
                  cx="8"
                  cy="8"
                  r="3.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.17 3.17l1.06 1.06M11.77 11.77l1.06 1.06M3.17 12.83l1.06-1.06M11.77 4.23l1.06-1.06"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="system"
              title="System"
              aria-label="System theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="2"
                  y="3"
                  width="12"
                  height="9"
                  rx="1.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M5.5 14.5h5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="dark"
              title="Dark"
              aria-label="Dark theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.5 9.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7z"
                  stroke="currentColor"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="viewport-wrap">
        <div class="viewport" id="viewport"></div>
        <div class="scroll-jump-layer">
          <button
            type="button"
            class="scroll-jump scroll-jump-top"
            id="scroll-top-btn"
            title="Scroll to top"
            aria-label="Scroll to top"
            hidden
          >
            ↑
          </button>
          <button
            type="button"
            class="scroll-jump scroll-jump-bottom"
            id="scroll-bottom-btn"
            title="Scroll to bottom"
            aria-label="Scroll to bottom"
            hidden
          >
            ↓
          </button>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="prompt" rows="1" placeholder="Ask anything…"></textarea>
          <button type="button" id="send-btn">Send</button>
        </div>
      </div>
      <div class="statusbar">
        <div>
          <span id="window-status"></span>
          <span id="virtual-list-status"></span>
        </div>
      </div>
    </div>
    <script type="module" src="./streaming.ts"></script>
  </body>
</html>
