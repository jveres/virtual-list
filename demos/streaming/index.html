<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <style>
      html {
        background: #ffffff;
        color: #1a1d23;
        color-scheme: light;
      }

      body {
        background: inherit;
        color: inherit;
      }

      html.booting .shell {
        visibility: hidden;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #1a1d23;
          color: #d5d9e1;
          color-scheme: dark;
        }
      }

      html[data-theme="light"] {
        background: #ffffff;
        color: #1a1d23;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        background: #1a1d23;
        color: #d5d9e1;
        color-scheme: dark;
      }
    </style>
    <script>
      document.documentElement.classList.add("booting");
      document.documentElement.setAttribute(
        "data-theme",
        matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
      );
    </script>
    <title>virtual-list · streaming chat</title>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <span class="header-title">
          <a href="/" title="Back to demos">virtual-list</a>
          <span class="sep">·</span>streaming-chat
        </span>
        <div class="header-actions">
          <button
            type="button"
            class="icon-btn"
            id="ai-settings-btn"
            title="AI provider settings"
            aria-label="AI provider settings"
            aria-haspopup="dialog"
          >
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M2 4.5h6M12.8 4.5H14M2 11.5h1.2M8 11.5h6"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <circle
                cx="10.4"
                cy="4.5"
                r="1.9"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <circle
                cx="5.6"
                cy="11.5"
                r="1.9"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
          </button>
          <div class="theme-group" role="group" aria-label="Theme">
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="light"
              title="Light"
              aria-label="Light theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle
                  cx="8"
                  cy="8"
                  r="3.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.17 3.17l1.06 1.06M11.77 11.77l1.06 1.06M3.17 12.83l1.06-1.06M11.77 4.23l1.06-1.06"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="system"
              title="System"
              aria-label="System theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="2"
                  y="3"
                  width="12"
                  height="9"
                  rx="1.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M5.5 14.5h5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="dark"
              title="Dark"
              aria-label="Dark theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.5 9.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7z"
                  stroke="currentColor"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="viewport-wrap">
        <div class="viewport" id="viewport"></div>
        <div class="scroll-jump-layer">
          <button
            type="button"
            class="scroll-jump scroll-jump-top"
            id="scroll-top-btn"
            title="Scroll to top"
            aria-label="Scroll to top"
            hidden
          >
            ↑
          </button>
          <button
            type="button"
            class="scroll-jump scroll-jump-bottom"
            id="scroll-bottom-btn"
            title="Scroll to bottom"
            aria-label="Scroll to bottom"
            hidden
          >
            ↓
          </button>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="prompt" rows="1" placeholder="Ask anything…"></textarea>
          <button type="button" id="send-btn">Send</button>
        </div>
      </div>
      <dialog class="ai-settings-dialog" id="ai-settings-panel" tabindex="-1">
        <div class="ai-settings-dialog-title">AI provider</div>
        <label class="ai-settings-field">
          Provider
          <select id="ai-provider">
            <option value="simulated">Simulated</option>
            <option value="openai">OpenAI</option>
          </select>
        </label>
        <label class="ai-settings-field">
          OpenAI API key
          <input
            type="password"
            id="ai-api-key"
            placeholder="sk-…"
            autocomplete="new-password"
            spellcheck="false"
          />
          <span class="ai-settings-note" id="ai-key-status"></span>
        </label>
        <label class="ai-settings-field">
          Model
          <input
            type="text"
            id="ai-model"
            placeholder="gpt-5-mini"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="ai-settings-field">
          Tools
          <label class="ai-tool-option">
            <input type="checkbox" id="ai-tool-web-search" />
            Web search
          </label>
          <label class="ai-tool-option">
            <input type="checkbox" id="ai-tool-image" />
            Image generation
          </label>
          <label class="ai-tool-option">
            <input type="checkbox" id="ai-tool-code" />
            Code interpreter
          </label>
          <label class="ai-tool-option">
            <input type="checkbox" id="ai-reasoning" />
            Thinking summary
          </label>
        </div>
        <label class="ai-settings-field">
          Request context
          <select id="ai-context">
            <option value="12">Last 12 turns</option>
            <option value="50">Last 50 turns</option>
            <option value="0">Full history</option>
          </select>
        </label>
        <div class="ai-settings-actions">
          <button type="button" id="ai-test-key">Test key</button>
          <button type="button" id="ai-clear-history">Clear history</button>
        </div>
        <p class="ai-settings-note">
          Everything stays in this browser: the key in localStorage, the
          OpenAI conversation in IndexedDB. The key is sent only to
          api.openai.com, straight from this page. Not every model supports
          every tool — unsupported combinations fail with an inline error.
        </p>
      </dialog>
      <div class="statusbar">
        <div>
          <span id="window-status"></span>
          <span id="virtual-list-status"></span>
        </div>
      </div>
    </div>
    <script type="module" src="./streaming.ts"></script>
  </body>
</html>
