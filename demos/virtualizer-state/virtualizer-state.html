<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <style>
      html {
        background: #ffffff;
        color: #1a1d23;
        color-scheme: light;
      }

      body {
        background: inherit;
        color: inherit;
      }

      html.booting .shell {
        visibility: hidden;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #1a1d23;
          color: #d5d9e1;
          color-scheme: dark;
        }
      }

      html[data-theme="light"] {
        background: #ffffff;
        color: #1a1d23;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        background: #1a1d23;
        color: #d5d9e1;
        color-scheme: dark;
      }
    </style>
    <script>
      document.documentElement.classList.add("booting");
      document.documentElement.setAttribute(
        "data-theme",
        matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
      );
    </script>
    <title>virtual-list · virtualizer state</title>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <span class="header-title">
          <a href="/" title="Back to demos">virtual-list</a>
          <span class="sep">·</span>virtualizer-state
        </span>
        <div class="header-actions">
          <div class="theme-group" aria-label="Theme">
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="light"
              title="Light"
              aria-label="Light theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle
                  cx="8"
                  cy="8"
                  r="3.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.17 3.17l1.06 1.06M11.77 11.77l1.06 1.06M3.17 12.83l1.06-1.06M11.77 4.23l1.06-1.06"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="system"
              title="System"
              aria-label="System theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="2"
                  y="3"
                  width="12"
                  height="9"
                  rx="1.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M5.5 14.5h5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              type="button"
              class="theme-btn icon-btn"
              data-theme-choice="dark"
              title="Dark"
              aria-label="Dark theme"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.5 9.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7z"
                  stroke="currentColor"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                />
              </svg>
            </button>
          </div>
          <button
            type="button"
            class="icon-btn"
            id="top-btn"
            title="Scroll to top"
            aria-label="Scroll to top"
          >
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M8 13V3M3 7l5-4 5 4"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="bottom-btn"
            title="Scroll to bottom"
            aria-label="Scroll to bottom"
          >
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M8 3v10M3 9l5 4 5-4"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="viewport-wrap state-demo-wrap">
        <div class="viewport state-viewport" id="viewport"></div>
        <aside class="state-overlay" aria-label="Virtualizer controls">
          <section class="state-panel">
            <div class="panel-title">State</div>
            <dl class="state-grid">
              <dt>range</dt>
              <dd id="state-range">0-0</dd>
              <dt>mounted</dt>
              <dd id="state-mounted">0</dd>
              <dt>measured</dt>
              <dd id="state-measured">0</dd>
              <dt>scroll</dt>
              <dd id="state-scroll">0 / 0</dd>
              <dt>total</dt>
              <dd id="state-total">0</dd>
              <dt>edges</dt>
              <dd id="state-edges">top</dd>
              <dt>event</dt>
              <dd id="state-event">init</dd>
              <dt>drift</dt>
              <dd id="state-drift">0</dd>
            </dl>
          </section>
          <section class="state-panel">
            <div class="panel-title">Options</div>
            <div class="control-grid">
              <label class="control-row">
                <span>items</span>
                <input
                  id="count-input"
                  type="range"
                  min="20"
                  max="3000"
                  step="20"
                />
                <output id="count-value"></output>
              </label>
              <label class="control-row">
                <span>overscan</span>
                <input
                  id="overscan-input"
                  type="range"
                  min="0"
                  max="2200"
                  step="50"
                />
                <output id="overscan-value"></output>
              </label>
              <label class="control-row">
                <span>base height</span>
                <input
                  id="base-height-input"
                  type="range"
                  min="56"
                  max="220"
                  step="2"
                />
                <output id="base-height-value"></output>
              </label>
              <label class="control-row">
                <span>variance</span>
                <input
                  id="variance-input"
                  type="range"
                  min="0"
                  max="220"
                  step="4"
                />
                <output id="variance-value"></output>
              </label>
              <label class="control-row">
                <span>measure eps</span>
                <input
                  id="measure-epsilon-input"
                  type="range"
                  min="0"
                  max="8"
                  step="0.25"
                />
                <output id="measure-epsilon-value"></output>
              </label>
              <label class="control-row">
                <span>placeholder v</span>
                <input
                  id="placeholder-threshold-input"
                  type="range"
                  min="0.5"
                  max="10"
                  step="0.25"
                />
                <output id="placeholder-threshold-value"></output>
              </label>
              <label class="control-row">
                <span>render mode</span>
                <select id="render-mode-select">
                  <option value="virtual">virtual</option>
                  <option value="full">full</option>
                </select>
              </label>
              <label class="check-row">
                <input id="placeholder-toggle" type="checkbox" />
                <span>placeholders</span>
              </label>
              <label class="check-row">
                <input id="boundary-toggle" type="checkbox" />
                <span>boundary slots</span>
              </label>
              <label class="check-row">
                <input id="drift-toggle" type="checkbox" />
                <span>drift reporter</span>
              </label>
            </div>
          </section>
        </aside>
      </div>
      <div class="statusbar">
        <div>
          <span id="status-summary">0 items</span>
          <span class="sep">·</span>
          <span id="status-callback">init</span>
        </div>
      </div>
    </div>
    <script type="module" src="./virtualizer-state.ts"></script>
  </body>
</html>
