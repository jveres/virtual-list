<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Constrained table layout workload</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/20px system-ui; background: #edf1f5; }
  #status { height: 40px; padding: 10px; }
  #viewport { width: 1100px; max-width: 100%; height: calc(100vh - 40px); overflow: auto; overscroll-behavior: contain; }
  article { background: white; padding: 12px; border-bottom: 1px solid #ccd; contain: layout style; }
  .compact { min-height: 80px; }
  /* Both controls accept the same host-owned column and wrapping contract. */
  .constrained .markdown .table-wrapper { width: 100%; }
  .constrained .markdown table { display: table; width: 100%; max-width: none; table-layout: auto; }
  .constrained .markdown th, .constrained .markdown td, .constrained .markdown td code { white-space: normal; overflow-wrap: anywhere; }
  .constrained .markdown table img { max-width: 100%; height: auto; }
  .constrained.fixed .markdown table { table-layout: fixed; }
</style>
</head>
<body>
<div id="status">Host-owned columns, wrapping, images and live updates</div>
<div id="viewport"></div>
<script type="module" src="./table-layout.js"></script>
</body>
</html>
