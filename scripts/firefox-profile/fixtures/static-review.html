<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Isolated runtime candidate measurements</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px system-ui; }
    #status { height: 40px; padding: 8px; }
    #viewport { height: calc(100vh - 40px); overflow: auto; overflow-anchor: none; }
    .control-row { height: 64px; border-bottom: 1px solid #ddd; padding: 16px; }
    .probe { position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; height: 600px; overflow: auto; }
    .rich td { border: 1px solid #ddd; padding: 4px; }
    .rich table { width: 100%; border-collapse: collapse; }
    .rich pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="status">Preparing component measurements</div>
  <div id="viewport"></div>
  <script type="module" src="./static-review.js"></script>
</body>
</html>
