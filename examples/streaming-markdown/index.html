<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streaming Markdown integration</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui; }
      main { max-width: 800px; margin: auto; height: 100dvh; display: flex; flex-direction: column; }
      #viewport { flex: 1; min-height: 0; overflow: auto; }
      .message { padding: 16px; }
      .message.user { background: #eaf1ff; white-space: pre-wrap; }
      form { display: flex; align-items: end; gap: 10px; padding: 12px; }
      textarea { flex: 1; min-width: 0; resize: none; font: inherit; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <output id="status">Loading renderer</output>
      <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: keyboard scrolling requires a focusable region -->
      <div id="viewport" role="region" aria-label="Markdown messages" tabindex="0"></div>
      <form>
        <textarea aria-label="Message" rows="1">Show a rich reply</textarea>
        <button type="submit" disabled>Send</button>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
